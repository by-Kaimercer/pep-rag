<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEP RAG</title>
<style>
:root{--bg:#0b0c0e;--panel:#111316;--line:#22252a;--text:#d9dce1;--dim:#8a909a;--accent:#7fd1b9;--accent-dim:#2a4a41;--warn:#e0b25c;--bad:#d9786c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Inter","Segoe UI",system-ui,sans-serif}
header{border-bottom:1px solid var(--line);padding:18px 28px;display:flex;align-items:baseline;gap:24px;flex-wrap:wrap}
h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.04em}
h1 .sq{color:var(--accent)}
h1 .sub{color:var(--dim);font-weight:400}
nav{display:flex;gap:4px;margin-left:auto}
nav button{background:none;border:0;color:var(--dim);padding:6px 14px;font:inherit;font-size:13px;cursor:pointer;border-bottom:2px solid transparent}
nav button.on{color:var(--text);border-color:var(--accent)}
main{max-width:920px;margin:0 auto;padding:28px}
.hide{display:none}
textarea{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);font:inherit;padding:12px 14px;border-radius:4px;resize:vertical;min-height:72px}
textarea:focus,select:focus{outline:1px solid var(--accent);border-color:var(--accent)}
.row{display:flex;gap:12px;align-items:center;margin-top:10px;flex-wrap:wrap}
select{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:7px 10px;border-radius:4px;font:inherit;font-size:13px}
.go{background:var(--accent);color:#06130f;border:0;padding:8px 20px;border-radius:4px;font:600 13px "Segoe UI",sans-serif;cursor:pointer}
.go:disabled{opacity:.4;cursor:wait}
.hint{font:12px Consolas,monospace;color:var(--dim)}
.ex{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
.ex button{background:none;border:1px solid var(--line);color:var(--dim);padding:5px 10px;border-radius:3px;font:inherit;font-size:12.5px;cursor:pointer;text-align:left}
.ex button:hover{border-color:var(--accent);color:var(--text)}
.label{font:11px Consolas,monospace;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin:28px 0 10px}
.answer{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);padding:16px 18px;border-radius:4px;font-size:16px;white-space:pre-wrap}
.answer.refused{border-left-color:var(--warn)}
.refuse-tag{display:block;font:12px Consolas,monospace;color:var(--warn);margin-bottom:6px;letter-spacing:.06em}
.chip{display:inline-block;font:12px Consolas,monospace;background:var(--accent-dim);color:var(--accent);border:0;border-radius:3px;padding:0 6px;margin:0 1px;cursor:pointer;line-height:1.5}
.chip:hover{background:var(--accent);color:#06130f}
.timing{font:12px Consolas,monospace;color:var(--dim);margin-top:10px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:12px 14px;margin-bottom:10px;transition:border-color .2s,box-shadow .2s}
.card.hl{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card.cited .num{color:var(--accent)}
.ch{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.num{font:600 13px Consolas,monospace;color:var(--dim)}
.ttl{font-weight:600}
.badge{font:11px Consolas,monospace;border:1px solid var(--line);border-radius:3px;padding:0 6px;color:var(--dim);margin-left:auto}
.badge.final,.badge.active,.badge.accepted{color:var(--accent);border-color:var(--accent-dim)}
.badge.withdrawn,.badge.rejected{color:var(--bad);border-color:#4a2a26}
.badge.deferred,.badge.draft{color:var(--warn);border-color:#4a3d22}
.sec{font:12px Consolas,monospace;color:var(--dim);margin:4px 0 8px}
.txt{font-size:13.5px;color:#b8bcc4;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card.open .txt{display:block;-webkit-line-clamp:unset}
.more{background:none;border:0;color:var(--accent);font:12px Consolas,monospace;cursor:pointer;padding:6px 0 0}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--accent-dim);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
.err{color:var(--bad);font:13px Consolas,monospace}
.wait{font:13px Consolas,monospace;color:var(--dim)}
table{width:100%;border-collapse:collapse;font:12.5px Consolas,monospace}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--dim);font-weight:400;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
td.m{color:var(--text)}
.cell{position:relative;min-width:84px}
.cell .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--accent-dim)}
.cell.best{color:var(--accent);font-weight:700}
.cell.best .bar{background:var(--accent)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.empty{border:1px dashed var(--line);padding:24px;border-radius:4px;color:var(--dim);font-size:14px}
.empty code{color:var(--accent);font-family:Consolas,monospace}
</style>
</head>
<body>
<header>
  <h1><span class="sq">&#9632;</span> PEP&nbsp;RAG <span class="sub">/ local retrieval over 747 PEPs</span></h1>
  <nav><button id="t-ask" class="on">Ask</button><button id="t-evals">Evals</button></nav>
</header>
<main>
<section id="p-ask">
  <textarea id="q" placeholder="Ask a question about Python's design..."></textarea>
  <div class="row">
    <select id="mode"></select>
    <button class="go" id="go">Ask</button>
    <span class="hint">ctrl+enter</span>
  </div>
  <div class="ex" id="ex"></div>
  <div id="out"></div>
</section>
<section id="p-evals" class="hide"><div id="evals"></div></section>
</main>
<script>
const LABELS={bm25:"BM25 keyword",dense_plain:"Dense (plain chunks)",dense_ctx:"Dense (contextual chunks)",hybrid:"Hybrid BM25 + dense",hybrid_route:"Hybrid + routing",hybrid_route_rerank:"Hybrid + routing + rerank"};
const EXAMPLES=["Why can't the walrus operator be used as a top-level statement?","What does PEP 8 say about line length for comments?","How do PEP 604 union types differ from typing.Union syntax?","Which PEP added a built-in YAML parser?"];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

fetch("/api/modes").then(r=>r.json()).then(d=>{
  $("mode").innerHTML=d.modes.map(m=>`<option value="${m}" ${m==="hybrid_route"?"selected":""}>${esc(LABELS[m]||m)}</option>`).join("");
});
$("ex").innerHTML=EXAMPLES.map(e=>`<button>${esc(e)}</button>`).join("");
$("ex").onclick=e=>{if(e.target.tagName==="BUTTON"){$("q").value=e.target.textContent;ask();}};

function tab(n){for(const t of ["ask","evals"]){$("t-"+t).classList.toggle("on",t===n);$("p-"+t).classList.toggle("hide",t!==n)}if(n==="evals")loadEvals();}
$("t-ask").onclick=()=>tab("ask");$("t-evals").onclick=()=>tab("evals");
$("go").onclick=ask;
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey))ask()});

async function ask(){
  const question=$("q").value.trim();if(!question)return;
  $("go").disabled=true;
  $("out").innerHTML=`<div class="label">Working</div><div class="wait"><span class="spin"></span>retrieving and generating &mdash; typically 5&ndash;15 s</div>`;
  try{
    const r=await fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question,mode:$("mode").value})});
    if(!r.ok){let m=r.statusText;try{m=(await r.json()).detail||m}catch(e){}throw new Error(r.status+" "+m)}
    render(await r.json());
  }catch(e){$("out").innerHTML=`<div class="label">Error</div><div class="err">${esc(e.message)}</div>`}
  finally{$("go").disabled=false}
}

function render(d){
  const cited=new Set(d.citations||[]);
  const ans=esc(d.answer).replace(/\[PEP\s*(\d{1,4})[^\]]*\]/gi,(m,n)=>`<button class="chip" data-pep="${n}">PEP ${n}</button>`);
  const head=d.refused?`<span class="refuse-tag">REFUSED &mdash; NOT IN THE PEPs</span>`:"";
  const cards=(d.sources||[]).map((c,i)=>{
    const st=String(c.status||"").toLowerCase().replace(/[^a-z]/g,"");
    return `<div class="card ${cited.has(c.pep)?"cited":""}" data-pep="${c.pep}" id="src-${i}">
      <div class="ch"><span class="num">PEP ${c.pep}</span><span class="ttl">${esc(c.title)}</span><span class="badge ${st}">${esc(c.status||"")}${c.type?" &middot; "+esc(c.type):""}</span></div>
      <div class="sec">${esc(c.section||"")}${c.python_version?" &middot; py "+esc(c.python_version):""}</div>
      <div class="txt">${esc(c.text)}</div><button class="more">expand</button></div>`}).join("");
  $("out").innerHTML=`<div class="label">Answer</div><div class="answer ${d.refused?"refused":""}">${head}${ans}</div>
    <div class="timing">retrieval ${Math.round(d.retrieval_secs*1000)} ms &middot; generation ${Number(d.gen_secs).toFixed(1)} s</div>
    <div class="label">Sources (${(d.sources||[]).length})</div>${cards}`;
}
$("out").addEventListener("click",e=>{
  const t=e.target;
  if(t.classList.contains("chip")){
    const c=[...document.querySelectorAll(".card")].find(x=>x.dataset.pep===t.dataset.pep);
    if(c){c.scrollIntoView({behavior:"smooth",block:"center"});c.classList.add("hl");setTimeout(()=>c.classList.remove("hl"),1600)}
  }else if(t.classList.contains("more")){
    const c=t.closest(".card");c.classList.toggle("open");t.textContent=c.classList.contains("open")?"collapse":"expand";
  }
});

let loaded=false;
async function loadEvals(){
  if(loaded)return;
  const box=$("evals");box.innerHTML=`<div class="wait"><span class="spin"></span>loading</div>`;
  let d;try{d=await (await fetch("/api/results")).json()}catch(e){box.innerHTML=`<div class="err">${esc(e.message)}</div>`;return}
  let html="";
  if(d.retrieval&&Object.keys(d.retrieval).length){
    const modes=Object.keys(d.retrieval);
    const cols=[...new Set(modes.flatMap(m=>Object.keys(d.retrieval[m]||{})))].filter(c=>modes.some(m=>typeof d.retrieval[m][c]==="number"));
    const pri=["hit@5","mrr@5","pep_recall@5"];
    cols.sort((a,b)=>{const ia=pri.indexOf(a),ib=pri.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b)});
    html+=`<div class="label" style="margin-top:0">Retrieval</div>`+table(modes,cols,m=>d.retrieval[m]||{});
  }else html+=`<div class="label" style="margin-top:0">Retrieval</div><div class="empty">No retrieval results yet. Run the retrieval eval to produce <code>results/retrieval.json</code>.</div>`;
  if(d.generation&&Object.keys(d.generation).length){
    const modes=Object.keys(d.generation);
    const cols=[...new Set(modes.flatMap(m=>Object.keys(d.generation[m]||{})))].filter(c=>modes.some(m=>typeof (d.generation[m]||{})[c]==="number"));
    html+=`<div class="label">Generation</div>`+table(modes,cols,m=>d.generation[m]||{});
  }else html+=`<div class="label">Generation</div><div class="empty">No generation results yet. Run the generation eval to produce <code>results/generation.json</code>.</div>`;
  box.innerHTML=html;
  loaded=!!(d.retrieval&&d.generation);
}
const LOWER_BETTER=/secs|latency|time|ms$|error|halluc/i;
function table(modes,cols,get){
  const best={};
  for(const c of cols){
    const vals=modes.map(m=>get(m)[c]).filter(v=>typeof v==="number");
    if(!vals.length)continue;
    best[c]={max:Math.max(...vals),min:Math.min(...vals),better:LOWER_BETTER.test(c)?"min":"max"};
  }
  const head=`<tr><th>mode</th>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>`;
  const rows=modes.map(m=>`<tr><td class="m">${esc(m)}</td>${cols.map(c=>{
    const v=get(m)[c];if(typeof v!=="number")return `<td class="cell">&ndash;</td>`;
    const b=best[c],isBest=v===b[b.better]&&b.max!==b.min;
    const frac=LOWER_BETTER.test(c)?(b.max?v/b.max:0):Math.max(0,Math.min(1,v));
    return `<td class="cell ${isBest?"best":""}">${v.toFixed(3)}<span class="bar" style="width:${(frac*100).toFixed(1)}%"></span></td>`}).join("")}</tr>`).join("");
  return `<div class="scroll"><table>${head}${rows}</table></div>`;
}
</script>
</body>
</html>
